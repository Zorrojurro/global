<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIS Price Assistant</title>
  <link rel="icon" type="image/png" href="images/GIS_LOGO.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #FF6B35;
      --navy: #0F172A;
      --navy2: #1E293B;
      --white: #fff;
      --grey: #94A3B8;
      --green: #10B981;
      --red: #EF4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 20px 40px;
    }

    /* Header */
    .header {
      width: 100%;
      max-width: 480px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }
    .header img { height: 40px; width: auto; }
    .header-text h1 { font-size: 1.1rem; font-weight: 700; }
    .header-text p { font-size: 0.8rem; color: var(--grey); }

    /* Mic area */
    .mic-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .mic-btn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--navy2);
      border: 3px solid var(--orange);
      color: var(--orange);
      font-size: 2.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .mic-btn:hover { background: #263148; transform: scale(1.04); }
    .mic-btn:active { transform: scale(0.97); }

    .mic-btn.listening {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--white);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .mic-btn.thinking {
      border-color: var(--grey);
      color: var(--grey);
      cursor: default;
      animation: spin-border 1.2s linear infinite;
    }

    .mic-btn.speaking {
      border-color: var(--green);
      color: var(--green);
      animation: pulse-green 1.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 53, 0.5); }
      50% { box-shadow: 0 0 0 20px rgba(255, 107, 53, 0); }
    }
    @keyframes pulse-green {
      0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5); }
      50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
    }
    @keyframes spin-border {
      from { box-shadow: 0 0 0 3px transparent; }
    }

    .status-text {
      font-size: 1rem;
      font-weight: 500;
      color: var(--grey);
      min-height: 1.5rem;
      text-align: center;
    }
    .status-text.listening { color: var(--orange); }
    .status-text.thinking { color: var(--grey); }
    .status-text.speaking { color: var(--green); }

    /* Transcript */
    .transcript {
      width: 100%;
      max-width: 480px;
      background: var(--navy2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 64px;
      display: none;
    }
    .transcript.visible { display: block; }
    .transcript-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--grey);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .transcript-text {
      font-size: 1rem;
      color: var(--white);
      line-height: 1.5;
    }

    /* Response */
    .response {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, #1a2d1a, #142820);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px;
      padding: 20px;
      min-height: 80px;
      display: none;
    }
    .response.visible { display: block; }
    .response-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .response-text {
      font-size: 1.1rem;
      color: var(--white);
      line-height: 1.6;
      font-weight: 400;
    }

    /* Replay button */
    .replay-btn {
      background: none;
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: var(--green);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      margin-top: 14px;
      display: none;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .replay-btn.visible { display: flex; }
    .replay-btn:hover { background: rgba(16, 185, 129, 0.1); }

    /* Error */
    .error-text {
      color: var(--red);
      font-size: 0.9rem;
      text-align: center;
      max-width: 480px;
      display: none;
      margin-top: 12px;
    }
    .error-text.visible { display: block; }

    /* Back link */
    .back-link {
      margin-top: 40px;
      color: var(--grey);
      font-size: 0.85rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--white); }

    /* No speech support */
    .no-support {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 16px 20px;
      color: var(--red);
      font-size: 0.9rem;
      max-width: 480px;
      text-align: center;
      display: none;
    }
    .no-support.visible { display: block; }

    @media (max-width: 380px) {
      .mic-btn { width: 100px; height: 100px; font-size: 2.4rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="images/GIS_LOGO.png" alt="GIS">
    <div class="header-text">
      <h1>Price Assistant</h1>
      <p>Ask about any product price</p>
    </div>
  </div>

  <div class="no-support" id="noSupport">
    Your browser doesn't support voice input. Please use Chrome on Android or desktop.
  </div>

  <div class="mic-area">
    <button class="mic-btn" id="micBtn" aria-label="Start listening">
      <i class="fas fa-microphone" id="micIcon"></i>
    </button>
    <p class="status-text" id="statusText">Tap to ask a question</p>
  </div>

  <div class="transcript" id="transcript">
    <div class="transcript-label"><i class="fas fa-user"></i> You asked</div>
    <div class="transcript-text" id="transcriptText"></div>
  </div>

  <div class="response" id="response">
    <div class="response-label"><i class="fas fa-robot"></i> Answer</div>
    <div class="response-text" id="responseText"></div>
    <button class="replay-btn" id="replayBtn">
      <i class="fas fa-volume-up"></i> Replay
    </button>
  </div>

  <div class="error-text" id="errorText"></div>

  <a href="index.html" class="back-link">
    <i class="fas fa-arrow-left"></i> Back to site
  </a>

  <script>
    const micBtn = document.getElementById('micBtn');
    const micIcon = document.getElementById('micIcon');
    const statusText = document.getElementById('statusText');
    const transcriptEl = document.getElementById('transcript');
    const transcriptText = document.getElementById('transcriptText');
    const responseEl = document.getElementById('response');
    const responseText = document.getElementById('responseText');
    const replayBtn = document.getElementById('replayBtn');
    const errorText = document.getElementById('errorText');
    const noSupport = document.getElementById('noSupport');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      noSupport.classList.add('visible');
      micBtn.disabled = true;
      micBtn.style.opacity = '0.4';
    }

    let recognition = null;
    let currentAnswer = '';
    let state = 'idle'; // idle | listening | thinking | speaking

    function setState(s) {
      state = s;
      micBtn.className = 'mic-btn ' + (s !== 'idle' ? s : '');
      statusText.className = 'status-text ' + (s !== 'idle' ? s : '');

      const icons = { idle: 'fa-microphone', listening: 'fa-stop', thinking: 'fa-spinner fa-spin', speaking: 'fa-volume-up' };
      const labels = { idle: 'Tap to ask a question', listening: 'Listening… tap to stop', thinking: 'Looking it up…', speaking: 'Speaking…' };
      micIcon.className = 'fas ' + icons[s];
      statusText.textContent = labels[s];
    }

    function showError(msg) {
      errorText.textContent = msg;
      errorText.classList.add('visible');
      setTimeout(() => errorText.classList.remove('visible'), 5000);
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.88;
      utterance.pitch = 1;
      utterance.lang = 'en-IN';

      // prefer an Indian English voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferred = voices.find(v => v.lang === 'en-IN') ||
                        voices.find(v => v.lang.startsWith('en-') && v.name.toLowerCase().includes('female')) ||
                        voices.find(v => v.lang.startsWith('en'));
      if (preferred) utterance.voice = preferred;

      utterance.onstart = () => setState('speaking');
      utterance.onend = () => setState('idle');
      utterance.onerror = () => setState('idle');
      window.speechSynthesis.speak(utterance);
    }

    async function askClaude(question) {
      setState('thinking');
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });
        if (!res.ok) throw new Error('Server error ' + res.status);
        const data = await res.json();
        currentAnswer = data.answer;

        responseText.textContent = currentAnswer;
        responseEl.classList.add('visible');
        replayBtn.classList.add('visible');

        speak(currentAnswer);
      } catch (err) {
        setState('idle');
        showError('Could not get answer. Check your connection and try again.');
      }
    }

    function startListening() {
      if (!SpeechRecognition) return;
      recognition = new SpeechRecognition();
      recognition.lang = 'en-IN';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => setState('listening');

      recognition.onresult = (e) => {
        const question = e.results[0][0].transcript.trim();
        transcriptText.textContent = question;
        transcriptEl.classList.add('visible');
        responseEl.classList.remove('visible');
        replayBtn.classList.remove('visible');
        askClaude(question);
      };

      recognition.onerror = (e) => {
        setState('idle');
        if (e.error === 'no-speech') showError('No speech detected. Try again.');
        else if (e.error === 'not-allowed') showError('Microphone access denied. Please allow microphone permission.');
        else showError('Error: ' + e.error);
      };

      recognition.onend = () => {
        if (state === 'listening') setState('idle');
      };

      recognition.start();
    }

    function stopListening() {
      if (recognition) recognition.stop();
      setState('idle');
    }

    micBtn.addEventListener('click', () => {
      if (state === 'idle') startListening();
      else if (state === 'listening') stopListening();
      else if (state === 'speaking') { window.speechSynthesis.cancel(); setState('idle'); }
    });

    replayBtn.addEventListener('click', () => {
      if (currentAnswer) speak(currentAnswer);
    });

    // load voices early (needed on some browsers)
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
